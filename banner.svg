<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Abdullah Al Imran. Thinks like a scientist. Builds like an engineer. Leads with vision.">
  <style>
    .t { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .in { animation: fadeUp 0.9s ease-out backwards; }
    .d1 { animation-delay: 0.1s; } .d2 { animation-delay: 0.5s; } .d3 { animation-delay: 1.0s; }
    .d4 { animation-delay: 1.4s; } .d5 { animation-delay: 1.8s; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .tw { animation: twinkle 3s ease-in-out infinite; }
    .tw2 { animation: twinkle 4.5s ease-in-out infinite 1.2s; }
    .tw3 { animation: twinkle 3.7s ease-in-out infinite 2.1s; }
    @keyframes twinkle { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
    .net { animation: drift 9s ease-in-out infinite alternate; }
    @keyframes drift { from { transform: translate(0, 0); } to { transform: translate(-10px, 6px); } }
    .shimmer { animation: shimmer 2.6s ease-in-out infinite; }
    @keyframes shimmer { 0%, 100% { opacity: 0.15; } 50% { opacity: 0.45; } }
  </style>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05080c"/>
      <stop offset="0.6" stop-color="#081118"/>
      <stop offset="1" stop-color="#0b1c26"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.88" cy="0.15" r="0.45">
      <stop offset="0" stop-color="#22c1d6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22c1d6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1922"/>
      <stop offset="1" stop-color="#05080c"/>
    </linearGradient>
    <clipPath id="wave">
      <path d="M0,0 H1200 V268 C1050,298 900,248 720,272 C540,296 360,250 180,274 C110,284 50,280 0,272 Z"/>
    </clipPath>
  </defs>

  <g clip-path="url(#wave)">
    <rect width="1200" height="300" fill="url(#sky)"/>
    <rect width="1200" height="300" fill="url(#glow)"/>

    <!-- network constellation -->
    <g class="net" stroke="#22c1d6" stroke-width="0.8" stroke-opacity="0.35" fill="#22c1d6">
      <path d="M930,30 L1010,60 L1090,25 L1160,70 L1195,20 M1010,60 L1060,110 L1160,70 M1090,25 L1060,110 M1060,110 L1140,135 L1160,70 M980,95 L1010,60 M980,95 L1060,110" fill="none"/>
      <circle cx="930" cy="30" r="2" class="tw"/>
      <circle cx="1010" cy="60" r="2.5" class="tw2"/>
      <circle cx="1090" cy="25" r="2" class="tw3"/>
      <circle cx="1160" cy="70" r="2.5" class="tw"/>
      <circle cx="1195" cy="20" r="1.8" class="tw2"/>
      <circle cx="1060" cy="110" r="2.2" class="tw3"/>
      <circle cx="1140" cy="135" r="1.8" class="tw"/>
      <circle cx="980" cy="95" r="1.8" class="tw2"/>
    </g>

    <!-- water -->
    <rect y="236" width="1200" height="64" fill="url(#water)"/>

    <!-- skyline -->
    <g fill="#132a38">
      <rect x="880" y="214" width="18" height="22"/>
      <rect x="902" y="198" width="22" height="38"/>
      <rect x="928" y="206" width="16" height="30"/>
      <rect x="948" y="186" width="20" height="50"/>
      <rect x="972" y="200" width="18" height="36"/>
      <!-- three towers + skypark -->
      <path d="M1004,236 L1008,170 L1034,170 L1036,236 Z"/>
      <path d="M1046,236 L1050,170 L1076,170 L1078,236 Z"/>
      <path d="M1088,236 L1092,170 L1118,170 L1120,236 Z"/>
      <path d="M996,166 Q1062,158 1132,164 L1132,171 Q1062,165 996,172 Z" fill="#14303d"/>
      <!-- dome -->
      <path d="M1124,236 Q1140,214 1158,236 Z" fill="#12293a"/>
    </g>

    <!-- supertrees -->
    <g stroke="#1aa3b5" stroke-width="2" fill="none" opacity="0.8">
      <path d="M1170,236 L1170,204"/><path d="M1158,198 Q1170,210 1182,198"/>
      <path d="M1192,236 L1192,212"/><path d="M1182,207 Q1192,217 1202,207"/>
    </g>

    <!-- lit windows -->
    <g fill="#f5c46b">
      <g class="tw"><rect x="1014" y="180" width="3" height="2"/><rect x="1024" y="196" width="3" height="2"/><rect x="1060" y="188" width="3" height="2"/><rect x="1100" y="204" width="3" height="2"/><rect x="954" y="196" width="3" height="2"/></g>
      <g class="tw2"><rect x="1018" y="212" width="3" height="2"/><rect x="1066" y="178" width="3" height="2"/><rect x="1106" y="186" width="3" height="2"/><rect x="908" y="208" width="3" height="2"/><rect x="976" y="214" width="3" height="2"/></g>
      <g class="tw3"><rect x="1028" y="224" width="3" height="2"/><rect x="1056" y="214" width="3" height="2"/><rect x="1096" y="220" width="3" height="2"/><rect x="934" y="218" width="3" height="2"/><rect x="960" y="222" width="3" height="2"/></g>
    </g>

    <!-- reflection -->
    <g transform="translate(0,472) scale(1,-1)" opacity="0.22" fill="#1b4252">
      <rect x="948" y="186" width="20" height="50"/>
      <path d="M1004,236 L1008,170 L1034,170 L1036,236 Z"/>
      <path d="M1046,236 L1050,170 L1076,170 L1078,236 Z"/>
      <path d="M1088,236 L1092,170 L1118,170 L1120,236 Z"/>
    </g>
    <g stroke="#f5c46b" stroke-width="1.5" class="shimmer">
      <path d="M1012,246 h10 M1058,252 h12 M1100,248 h8 M952,250 h8 M1030,262 h14 M1086,266 h10"/>
    </g>
    <path d="M860,236 H1200" stroke="#22c1d6" stroke-opacity="0.25"/>

    <!-- text -->
    <g class="t">
      <text x="190" y="82" font-size="20" fill="#e8ecef" class="in d1">Abdullah Al Imran</text>
      <text x="190" y="128" font-size="34" font-weight="700" fill="#ffffff" class="in d2">Thinks like a scientist. Builds like an engineer.</text>
      <text x="190" y="170" font-size="34" font-weight="700" fill="#22c1d6" class="in d3">Leads with vision.</text>
      <text x="190" y="210" font-size="18" font-weight="600" fill="#ffffff" class="in d4">AI Strategy &amp; Architecture  |  Agentic AI  |  Enterprise Transformation</text>
      <text x="190" y="242" font-size="15" fill="#cfd8dc" letter-spacing="0.6" class="in d5">www.imranabdullah.com</text>
    </g>
  </g>
</svg>
